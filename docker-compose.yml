name: mini-ai-dos

# Minimal by design: the gateway and Postgres, nothing else. No Redis,
# no NATS — Mini AI-DOS is a small AI gateway, and nothing in it uses
# them. Postgres is provisioned for the migration path
# (services/gateway/migrations/); the gateway runtime does not require
# it yet.

services:
  mini-ai-dos:
    build: .
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      # env mode (default): only MINI_AI_DOS_API_KEY matters.
      # database mode: set API_KEY_AUTH_MODE=database in .env — the
      # gateway then authenticates against Postgres and fails fast if
      # it is unreachable or unmigrated. Development-safe credentials,
      # compose-only, matching the postgres service below.
      API_KEY_AUTH_MODE: ${API_KEY_AUTH_MODE:-env}
      MINI_AI_DOS_API_KEY: ${MINI_AI_DOS_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://mini_ai_dos:mini_ai_dos_local@postgres:5432/mini_ai_dos?sslmode=disable}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL: ${AI_MODEL:-}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RATE_LIMIT_REQUESTS: ${RATE_LIMIT_REQUESTS:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mini_ai_dos
      POSTGRES_PASSWORD: mini_ai_dos_local
      POSTGRES_DB: mini_ai_dos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_ai_dos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
